<!DOCTYPE html>
<html lang="pt-BR">
<head>
            <meta name="description" content="Área do estudante: recursos, dicas e ferramentas para apoiar sua formação em nutrição.">
            <link rel="canonical" href="https://alimentandofases.com/estudante/" />
            <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebPage",
                "name": "Área do Estudante - Alimentando Fases",
                "url": "https://alimentandofases.com/estudante/"
            }
            </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Estudante</title>
    
    <script src="../global/developer-console.js"></script>
    <link rel="icon" href="../Imagens/logofavicon.webp">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <link rel="stylesheet" href="../perfil/css/core.css">
    <link rel="stylesheet" href="../perfil/css/layout.css">
    <link rel="stylesheet" href="style.css">

    <style>
        .content-area { padding-top: 30px !important; }
        .sidebar-admin-badge {
            background: #8e44ad; color: white;
            font-size: 0.6rem; padding: 4px 8px;
            border-radius: 4px; margin-top: 8px;
            display: none; justify-content: center;
            font-weight: 700; width: 100%; text-align: center;
        }
    </style>
</head>
<body class="dashboard-body student-theme">

    <div id="af-global-loader">
        <div class="af-spinner-box">
            <div class="af-ring purple"></div>
        </div>
    </div>

    <div class="main-layout" style="display:none;" id="main-interface">
        
        <nav class="sidebar">
            <div class="logo-area">
                <img src="../Imagens/logofavicon.webp" alt="Logo" class="sidebar-logo-img">
                <div class="brand-text">ALIMENTANDO <span>FASES</span></div>
            </div>
            <ul class="nav-links">
                <li><a href="../index.html"><i class="fa-solid fa-house"></i> <span>Início</span></a></li>
                <li><a href="../comunidade/index.html"><i class="fa-solid fa-earth-americas"></i> <span>Comunidade</span></a></li>
                <li><a href="../IA/index.html"><i class="fa-solid fa-robot"></i> <span>Essentia</span></a></li>
                <li><a href="../notificacoes/index.html"><i class="fa-regular fa-bell"></i> <span>Notificações</span></a></li>
                <li>
                    <a href="../mensagens/index.html">
                        <div class="icon-container"><i class="fa-solid fa-envelope"></i><span id="sidebar-badge" class="nav-badge hidden">0</span></div>
                        <span>Mensagens</span>
                    </a>
                </li>
                <li id="nav-item-admin" style="display: none;"><a href="../admin/index.html"><i class="fa-solid fa-lock"></i> <span>Painel Admin</span></a></li>
                <li><a href="../calendario.html"><i class="fa-regular fa-calendar-check"></i> <span>Calendário</span></a></li>
                <li><a href="../configuracoes/index.html" id="btn-open-settings" role="button"><i class="fa-solid fa-gear"></i> <span>Configurações</span></a></li>
            </ul>
            <div class="nav-footer">
                <a href="../perfil/index.html" class="profile-pill-link">
                    <img src="https://ui-avatars.com/api/?name=User" class="nav-avatar" id="nav-avatar-img"> 
                    <div class="profile-info-mini"><span class="p-name">Meu Perfil</span></div>
                </a>
            </div>
        </nav>

        <main class="content-area">
            <div class="dashboard-grid xp-grid">
                <div class="xp-card">
                    <div class="xp-content">
                        <div class="xp-header">
                            <span class="level-badge">NÍVEL 3</span>
                            <span class="xp-points">1250 XP</span>
                        </div>
                        <div class="xp-bar-container">
                            <div class="xp-bar-fill" style="width: 65%;"></div>
                        </div>
                        <p class="xp-info">Próximo nível em 250 XP</p>
                    </div>
                    <i class="fa-solid fa-trophy xp-bg-icon"></i>
                </div>

                <div class="stat-card">
                    <div class="stat-icon purple"><i class="fa-solid fa-play"></i></div>
                    <div class="stat-info">
                        <h3>Cursos</h3>
                        <span class="stat-value">2</span>
                    </div>
                </div>
                
                <div class="stat-card">
                    <div class="stat-icon pink"><i class="fa-solid fa-clock"></i></div>
                    <div class="stat-info">
                        <h3>Horas</h3>
                        <span class="stat-value">12h</span>
                    </div>
                </div>
            </div>

            <section class="section-container">
                <div class="section-header">
                    <h3>Meus Cursos</h3>
                </div>
                <div class="courses-row">
                    <div class="course-card">
                        <div class="course-thumb nutri-bg"><i class="fa-solid fa-apple-whole"></i></div>
                        <div class="course-body">
                            <span class="tag">Nutrição</span>
                            <h4>Macronutrientes</h4>
                            <div class="progress-mini"><div class="bar" style="width: 40%"></div></div>
                            <button class="btn-course">Continuar</button>
                        </div>
                    </div>
                    <div class="course-card">
                        <div class="course-thumb mind-bg"><i class="fa-solid fa-brain"></i></div>
                        <div class="course-body">
                            <span class="tag">Psicologia</span>
                            <h4>Comportamento</h4>
                            <div class="progress-mini"><div class="bar" style="width: 10%"></div></div>
                            <button class="btn-course">Continuar</button>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="../firebase-config.js" type="module"></script>
    <script type="module" src="../global/sidebar-auth.js"></script>
    <script src="dashboard.js" type="module"></script>
</body>
</html>
