<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Nutricionista</title>
    
    <script src="../global/developer-console.js"></script>
    <link rel="icon" href="../Imagens/logofavicon.webp">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    
    <link rel="stylesheet" href="../perfil/css/core.css">
    <link rel="stylesheet" href="../perfil/css/layout.css">
    <link rel="stylesheet" href="style.css">
    
    <style>
        /* Força o conteúdo a colar no topo */
        .content-area { padding-top: 30px !important; }
        
        /* Badge Admin discreto na Sidebar */
        .sidebar-admin-badge {
            background: #2c3e50; color: white;
            font-size: 0.6rem; padding: 4px 8px;
            border-radius: 4px; margin-top: 8px;
            display: none; justify-content: center;
            font-weight: 700; width: 100%;
            text-align: center;
        }
    </style>
</head>
<body class="dashboard-body nutri-theme">

    <div id="af-global-loader">
        <div class="af-spinner-box">
            <div class="af-ring green"></div>
        </div>
    </div>

    <div class="main-layout" style="display:none;" id="main-interface">
        
        <nav class="sidebar nutri-sidebar">
            <div class="logo-area">
                <i class="fa-solid fa-seedling logo-icon"></i>
                <div class="brand-text">AF <span>CLÍNICA</span></div>
                <div id="admin-view-badge" class="sidebar-admin-badge">MODO ADMIN</div>
            </div>

            <ul class="nav-links">
                <li class="active"><a href="#"><i class="fa-solid fa-chart-pie"></i> <span>Visão Geral</span></a></li>
                <li><a href="#"><i class="fa-solid fa-users"></i> <span>Meus Pacientes</span></a></li>
                <li><a href="#"><i class="fa-solid fa-clipboard-list"></i> <span>Dietas</span></a></li>
                <li><a href="#"><i class="fa-regular fa-calendar-check"></i> <span>Agenda</span></a></li>
                
                <li class="nav-separator"><span class="separator-label">EXTRAS</span></li>
                <li><a href="../mensagens/index.html"><i class="fa-regular fa-comments"></i> <span>Mensagens</span></a></li>
                <li><a href="../IA/index.html"><i class="fa-solid fa-wand-magic-sparkles"></i> <span>Essentia IA</span></a></li>
                <li><a href="../comunidade/index.html"><i class="fa-solid fa-earth-americas"></i> <span>Comunidade</span></a></li>

                <li class="nav-separator"><span class="separator-label">SISTEMA</span></li>
                <li><a href="#" id="btn-notificacoes"><i class="fa-regular fa-bell"></i> <span>Notificações</span></a></li>
                <li><a href="#" id="btn-config"><i class="fa-solid fa-gear"></i> <span>Configurações</span></a></li>
            </ul>
            
            <div class="nav-footer">
                <a href="../perfil/index.html" class="profile-pill-link">
                    <img src="https://ui-avatars.com/api/?name=Nutri" class="nav-avatar" id="nav-avatar-img"> 
                    <div class="profile-info-mini">
                        <span class="p-name" id="nav-name">Carregando...</span>
                        <span class="p-sub">CRN: <span id="nav-crn">...</span></span>
                    </div>
                </a>
            </div>
        </nav>

        <main class="content-area">
            <div class="dashboard-grid">
                <div class="stat-card">
                    <div class="stat-icon green"><i class="fa-solid fa-users"></i></div>
                    <div class="stat-info">
                        <h3>Pacientes</h3>
                        <span class="stat-value">24</span>
                    </div>
                </div>
                <div class="stat-card orange">
                    <div class="stat-icon"><i class="fa-regular fa-calendar-days"></i></div>
                    <div class="stat-info">
                        <h3>Hoje</h3>
                        <span class="stat-value">3</span>
                    </div>
                </div>
                <div class="stat-card blue">
                    <div class="stat-icon"><i class="fa-solid fa-file-signature"></i></div>
                    <div class="stat-info">
                        <h3>Pendentes</h3>
                        <span class="stat-value">1</span>
                    </div>
                </div>
            </div>

            <section class="section-container">
                <div class="section-header">
                    <h3>Ações Rápidas</h3>
                </div>
                <div class="quick-actions-row">
                    <button class="action-btn"><i class="fa-solid fa-user-plus"></i> <span>Novo Paciente</span></button>
                    <button class="action-btn"><i class="fa-solid fa-utensils"></i> <span>Criar Dieta</span></button>
                    <button class="action-btn"><i class="fa-solid fa-wand-magic-sparkles"></i> <span>IA Assistente</span></button>
                </div>
            </section>

            <section class="section-container">
                <div class="section-header">
                    <h3>Agenda do Dia</h3>
                </div>
                <div class="activity-list">
                    <div class="list-item">
                        <div class="item-time">14:00</div>
                        <div class="item-info"><strong>Maria Silva</strong><span>Retorno</span></div>
                        <button class="btn-small-action">Ver</button>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
